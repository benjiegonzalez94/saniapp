name: verificar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo sobre la misma rama deja obsoleta la ejecución anterior: no
# tiene sentido pagar dos veces el arranque de Docker para revisar código que ya
# nadie va a fusionar.
concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # LTS. En local se usa Node 24, pero los módulos nativos que entran aquí
  # (libpg-query para check:sql, @resvg/resvg-js) publican binarios precompilados
  # para la LTS con más fiabilidad; sin ellos npm ci compilaría desde fuente.
  VERSION_NODE: '22'

jobs:
  verificar:
    runs-on: ubuntu-latest
    # El arranque de la pila de Supabase domina el tiempo del job. 25 minutos dan
    # margen a una descarga de imágenes en frío sin dejar un job colgado una hora.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.VERSION_NODE }}

      - name: Restaurar node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ env.VERSION_NODE }}-${{ hashFiles('package-lock.json') }}
          # A propósito SIN restore-keys: una coincidencia parcial devolvería un
          # node_modules de otro package-lock.json. El job pasaría en verde con
          # dependencias que no son las que se instalarán al fusionar, que es
          # justo el fallo que este workflow existe para evitar.

      - name: Instalar dependencias
        # Sólo si la caché falló: `npm ci` borra node_modules antes de instalar,
        # así que ejecutarlo tras un acierto tiraría la caché recién restaurada.
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      # ---------------------------------------------------------------------
      # Comprobaciones que no tocan la base. Van primero para que un error de
      # sintaxis o de tipos falle en menos de un minuto, sin esperar a Docker.
      # ---------------------------------------------------------------------
      - name: Sintaxis de las migraciones
        run: npm run check:sql

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      # ---------------------------------------------------------------------
      # Base de datos.
      #
      # Se usa la CLI de Supabase (`supabase start`) y NO el servicio `postgres`
      # de Actions con las migraciones aplicadas por psql. La razón no es
      # comodidad: las migraciones de este repositorio dependen de objetos que
      # crea la propia imagen de Supabase, no PostgreSQL a secas.
      #
      #   · Se referencian `auth.uid()`, `auth.users`, `storage.objects` y
      #     `storage.buckets` (0001, 0005, 0007, 0011, 9999).
      #   · Se otorgan privilegios a los roles `anon`, `authenticated`,
      #     `service_role` y `supabase_auth_admin` (0011_grants.sql), y
      #     9999_verify_security.sql aborta si un GRANT no cuadra con su política.
      #   · supabase/seed.sql inserta directamente en `auth.users`.
      #
      # Con un `postgres:17` pelado habría que fabricar a mano esos esquemas y
      # roles. Ese remedo se desincronizaría de la imagen real sin avisar, y el
      # modo de fallo sería el peor posible: CI en verde sobre una postura de
      # seguridad que en producción es distinta. La CLI aplica las mismas 17
      # migraciones y el mismo seed que `npm run db:start` en el portátil.
      #
      # La CLI se invoca con `npx` en vez de con supabase/setup-cli porque ya es
      # devDependency: así CI y desarrollo usan la versión del package-lock.json
      # y no hay dos números que mantener sincronizados a mano.
      # ---------------------------------------------------------------------
      - name: Levantar PostgreSQL con las migraciones
        run: npx supabase start

      - name: Publicar la configuración del Supabase local
        run: |
          # Las claves del entorno local son fijas y públicas, pero no se copian
          # aquí a mano: se leen de la propia CLI para que un cambio de formato
          # (los `sb_publishable_...` que sustituyen a los JWT) no deje este
          # archivo mintiendo en silencio.
          #
          # `status -o env` entrecomilla los valores y $GITHUB_ENV NO quita las
          # comillas: sin el `tr` la clave viajaría con ellas y sería inválida.
          #
          # El grep descarta todo lo que no sea una asignación. La CLI intercala
          # avisos —«Stopped services: [...]» cuando algún servicio queda
          # deshabilitado en config.toml, que aquí es el caso del pooler— y basta
          # con que uno salga por stdout para que el `.` intente ejecutarlo.
          npx supabase status -o env | tr -d '"' | grep -E '^[A-Z][A-Z0-9_]*=' > "$RUNNER_TEMP/supabase.env"
          set -a
          . "$RUNNER_TEMP/supabase.env"
          set +a

          # Si la CLI renombra alguna variable, esto detiene el job con un
          # mensaje legible. Sin la comprobación se exportaría una cadena vacía y
          # el fallo aparecería mucho más tarde, disfrazado de prueba rota.
          : "${DB_URL:?la CLI no expuso DB_URL; revise 'supabase status -o env'}"
          : "${API_URL:?la CLI no expuso API_URL; revise 'supabase status -o env'}"
          : "${ANON_KEY:?la CLI no expuso ANON_KEY; revise 'supabase status -o env'}"
          : "${SERVICE_ROLE_KEY:?la CLI no expuso SERVICE_ROLE_KEY; revise 'supabase status -o env'}"

          {
            echo "DATABASE_URL=$DB_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Generar claves de cifrado efímeras
        run: |
          # Se generan por ejecución y mueren con el runner. Nunca deben ser un
          # secreto del repositorio: un valor estable acabaría copiado a un .env
          # de verdad, y estas claves son las que abren las notas clínicas.
          #
          # Como CI parte de una base recién creada, no hay nada cifrado con una
          # clave anterior que quedara ilegible al cambiarlas.
          clave="$(openssl rand -base64 32)"
          indice="$(openssl rand -base64 32)"
          echo "::add-mask::$clave"
          echo "::add-mask::$indice"
          echo "SANITI_ENCRYPTION_KEYS={\"1\":\"$clave\"}" >> "$GITHUB_ENV"
          echo "SANITI_BLIND_INDEX_KEY=$indice" >> "$GITHUB_ENV"

      - name: Pruebas
        run: npm test

      # `verify` no compila la aplicación, así que sin este paso una ruta rota o
      # un fallo de prerenderizado pasarían el pipeline entero en verde. Va tras
      # levantar la base porque las páginas estáticas la consultan al compilar.
      - name: Compilación de producción
        run: npm run build

      - name: Deriva del esquema y postura de seguridad
        run: npm run check:drift

      - name: Diagnóstico de la base si algo falló
        if: failure()
        run: npx supabase status || true
